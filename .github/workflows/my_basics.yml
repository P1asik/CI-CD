name: CIplasikTest
env:
  APPLICATION_NAME    : "MyPlasik"
  DEPLOY_PACKAGE_NAME : "plasik_deploy-ver-${{ github.sha }}"
  
  

on: 
  push:
    branches:
    - main

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - name: clone_my_repo
        uses: actions/checkout@v1
      
      - name: printing helloword from tst
        run: echo "helloword from testing job"
        
      - name: execure few commands
        run: |
          echo "Hello msg1"
          echo "hello msg2"
          echo "Application name: ${{ env.APPLICATION_NAME }}"
      - name: list current folder
        run: ls -la
      - name: main commands
        run: |
          ls -la
          cat bot_code.ph
          echo "done cat"
          cd logs
          echo "done cd"
        
      
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: printing helloword from dpl
        run: echo "helloword from deploy job"
      - name: showing local env vars
        run: |
          echo " Var1 = ${{ env.VAR1 }}"
          echo " Var3 = $LOCAL_VAR"
          echo " Var2 = ${{ env.VAR2 }}"
        env:
          LOCAL_VAR: "This is super-local var"
          
      - name: Deoployment package
        run: echo "Deploy package name is ${{ env.DEPLOY_PACKAGE_NAME }}"
    needs: Testing
    env:
      VAR1  :  "This is job level Variable 1"
      VAR2  :  "This is job level Variable 2"
      
