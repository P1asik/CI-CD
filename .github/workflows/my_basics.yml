name: CIplasikTest
env:
  APPLICATION_NAME    : "MyPlasik"
  DEPLOY_PACKAGE_NAME : "plasik_deploy-ver-${{ github.sha }}"
  
  

on: 
  push:
    branches:
    - main

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - name: printing helloword from tst
        run: echo "helloword from testing job"
        
      - name: execure few commands
        run: |
          echo "Hello msg1"
          echo "hello msg2"
          echo "Application name: ${{ env.APPLICATION_NAME }}"
      - name: list current folder
        run: ls -la
        
      - name: cloning git.rep 
        run: |
          git clone https://github.com/P1asik/CI-CD.git
          ls -la
          cat bot_code.ph
          
        
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: printing helloword from dpl
        run: echo "helloword from deploy job"
        
      - name: Deoployment package
        run: echo "Deploy package name is ${{ env.DEPLOY_PACKAGE_NAME }}"
    needs: Testing
