name: full_ci-cd_latest

on:
  push:
    branches: [main, feature-new]
  pull_request:
    branches: [main]

env:
  ZIP_NAME: deploy.zip

jobs:
  ci_part:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r "${{ env.ZIP_NAME }}" . -x "*.git*"

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: ${{ env.ZIP_NAME }}
  cd_part:
    needs: ci_part
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download artifact (ZIP)
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip
          path: artifact

      - name: Show what we downloaded
        run: dir artifact

      - name: Deploy to D:\deploy\CI-CD
        shell: powershell
        run: |
          $deployDir = "D:\deploy\CI-CD"
          New-Item -ItemType Directory -Force -Path $deployDir | Out-Null

          $zipPath = (Get-ChildItem -Path "artifact" -Filter "*.zip" | Select-Object -First 1).FullName
          Write-Host "ZIP found: $zipPath"

          Expand-Archive -Path $zipPath -DestinationPath $deployDir -Force
          Write-Host "Deployed to $deployDir"
