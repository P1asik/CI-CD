name: full_ci-cd_latest

env:
  Plasik_APPLICATION_NAME: "MyPlasik"
  Plasik_ENVIRONMENT: "MyPlasik-env"
  Plasik_DEPLOY_PACKAGE_NAME: "plasik_app_${{ github.sha }}.zip"

on:
  push:
    branches: [main, feature-new]
  pull_request:
    branches: [main]

jobs:
  ci_part:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone repo
        uses: actions/checkout@v4

      - name: Create ZIP deployment package
        run: zip -r "${{ env.Plasik_DEPLOY_PACKAGE_NAME }}" . -x "*.git*"

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: ${{ env.Plasik_DEPLOY_PACKAGE_NAME }}
  cd_part:
    runs-on: self-hosted
    needs: ci_part

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip

      - name: Deploy to local folder
        shell: cmd
        run: |
          set DEPLOY_DIR=D:\deploy\CI-CD
          if not exist %DEPLOY_DIR% mkdir %DEPLOY_DIR%
          tar -xf *.zip -C %DEPLOY_DIR%
