name: full_ci-cd_latest 
env:
  Plasik_APPLICATION_NAME: "MyPlasik"
  Plasik_ENVIRONMENT: "MyPlasik-env"
  Plasik_DEPLOY_PACKAGE_NAME: "plasik_app_${{github.sha}}.zip"

on: 
  push:
    branches: [main,feature-new]
  pull_request:
    branches: [main]

jobs:
  ci_part:
    runs-on: ubuntu-latest
    steps:
    - name: Git clone git-repo
      uses: actions/checkout@v4
    - name: Create ZIP deployment package
      run: |
        sudo apt-get update
        sudo apt-get install -y zip
        zip -r ${{env.Plasik_DEPLOY_PACKAGE_NAME}} ./ -x *.git*
    - name: Upload build artifact (zip)
      uses: actions/upload-artifact@v4
      with:
        name: plasik_build
        path: ${{ env.Plasik_DEPLOY_PACKAGE_NAME }}
  cd_part:
    runs-on: [self-hosted, Windows, X64]
    needs: ci_part
    steps:
      - name: Allow PowerShell scripts for this job
        shell: powershell
        run: Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

      - name: Download artifact (ZIP)
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip
          path: .

      - name: Deploy to D:\deploy\CI-CD
        shell: powershell
        run: |
          $deployDir = "D:\deploy\CI-CD"
          if (!(Test-Path $deployDir)) { New-Item -ItemType Directory -Path $deployDir | Out-Null }
          Remove-Item -Recurse -Force "$deployDir\*" -ErrorAction SilentlyContinue
          Expand-Archive -Path "${{ env.Plasik_DEPLOY_PACKAGE_NAME }}" -DestinationPath $deployDir -Force
          Write-Host "Deployed to $deployDir"
