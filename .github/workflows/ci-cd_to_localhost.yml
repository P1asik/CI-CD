name: full_ci_cd_latest

env:
  Plasik_DEPLOY_PACKAGE_NAME: plasik_app_${{ github.sha }}.zip

on:
  push:
    branches: [main, feature-new]
  pull_request:
    branches: [main]

jobs:
  ci_part:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP deployment package
        run: |
          zip -r "${{ env.Plasik_DEPLOY_PACKAGE_NAME }}" . -x "*.git*"

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: ${{ env.Plasik_DEPLOY_PACKAGE_NAME }}

  cd_part:
    needs: ci_part
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Download artifact (ZIP)
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip
          path: artifact

      - name: Copy ZIP to deploy directory (NO unzip)
        shell: cmd
        run: |
          set DEPLOY_DIR=D:\deploy\CI-CD
          if not exist "%DEPLOY_DIR%" mkdir "%DEPLOY_DIR%"
          copy /Y "artifact\*.zip" "%DEPLOY_DIR%\deploy.zip"
          dir "%DEPLOY_DIR%"
